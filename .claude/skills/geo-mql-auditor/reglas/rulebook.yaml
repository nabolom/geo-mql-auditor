      nota: "900 adultos de EE. UU., 68,879 búsquedas, marzo 2025."
  verificado_el: "2026-09-10"
  colector: null
  puntua: false
  impacto_esperado: alto
  esfuerzo: medio
  dependencia: propio
  recomendacion: "Regla de método."
  nota_metodo: "AI Overviews requiere captura humana. Observado el 2026-09-12 en un panel de 18 prompts de un sitio universitario en México: una captura por agente automatizado (navegador controlado por script) devolvió 16 de 18 SIN_AIO con el mensaje «No se puede generar una Visión general creada por IA en este momento», mientras que la misma tanda capturada a mano en ventana de incógnito devolvió 18 de 18 con resumen. La ausencia de resumen en una captura automatizada no es evidencia de que Google no lo genere: solo cuenta como SIN_AIO la captura humana. Además, las fuentes del resumen llegan como enlaces google.com/goto que responden 403 al resolverse: la citación de AIO queda como desconocida, no como cero, y los dominios no entran al conteo; la mención sí se mide sobre el texto."

