# Rulebook de geo-mql-auditor. Verificado el 2026-09-10.
# Fuerza: A = documentación oficial del motor o estudio revisado por pares;
#         B = estudio de industria con metodología publicada; C = consenso o hipótesis.
# tipo_evidencia: requisito_oficial | efecto_experimental | correlacional | consenso.
# ambito: pagina | sitio | metodo | principio | analitica | crm | offpage | antipatron.
# Las reglas de ámbito metodo, principio y antipatron no puntúan.
# Formato restringido de YAML (ver scripts/geomql/reglas.py); cadenas entre comillas dobles.

- id: T-01
  categoria: tecnico
  ambito: pagina
  tipos_pagina: [todas]
  enunciado: "La URL responde 200 en su destino final, con un máximo de dos saltos de redirección y 301 para movimientos permanentes."
  titulo_hallazgo: "Código HTTP o cadena de redirecciones inadecuada"
  fuerza: A
  tipo_evidencia: requisito_oficial
  fuentes:
    - titulo: "Google Search Central, HTTP status codes, network and DNS errors"
      url: "https://developers.google.com/search/docs/crawling-indexing/http-network-errors"
      fuerza: A
      tipo_evidencia: requisito_oficial
      nota: "Google sigue hasta 10 saltos; 301 es señal fuerte y 302 débil; los 4xx se retiran del índice."
  verificado_el: "2026-09-10"
  colector: tecnico.codigo_http
  impacto_esperado: alto
  esfuerzo: bajo
  dependencia: desarrollo
  recomendacion: "Corrige el código de respuesta o acorta la cadena de redirecciones a un solo 301 hacia la URL canónica."

- id: T-02
  categoria: tecnico
  ambito: sitio
  tipos_pagina: [todas]
  enunciado: "robots.txt responde 200 o 404; un 5xx equivale a bloqueo total para crawlers conformes con RFC 9309."
  titulo_hallazgo: "robots.txt no disponible o con error de servidor"
  fuerza: A
  tipo_evidencia: requisito_oficial
  fuentes:
    - titulo: "RFC 9309, Robots Exclusion Protocol, sección 2.3.1"
      url: "https://www.rfc-editor.org/rfc/rfc9309.html"
      fuerza: A
      tipo_evidencia: requisito_oficial
      nota: "Con 5xx el crawler debe asumir disallow total; con 4xx puede acceder a todo."
    - titulo: "Google Search Central, How Google interprets the robots.txt specification"
      url: "https://developers.google.com/search/docs/crawling-indexing/robots/robots_txt"
      fuerza: A
      tipo_evidencia: requisito_oficial
      nota: "Actualizado 2026-08-31."
  verificado_el: "2026-09-10"
  colector: robots.disponibilidad
  impacto_esperado: alto
  esfuerzo: bajo
  dependencia: desarrollo
  recomendacion: "Asegura que /robots.txt devuelva 200 con reglas válidas o 404 si no se necesita."

- id: T-03
  categoria: tecnico
  ambito: sitio
  tipos_pagina: [todas]
  enunciado: "Los bots de búsqueda e índice de los motores de IA (OAI-SearchBot, Claude-SearchBot, PerplexityBot, Googlebot, bingbot, Applebot, Meta-WebIndexer) tienen acceso a las URLs que se quieren ver citadas."
  titulo_hallazgo: "Bots de búsqueda de motores IA bloqueados en robots.txt"
  fuerza: A
  tipo_evidencia: requisito_oficial
  fuentes:
    - titulo: "OpenAI, Overview of OpenAI crawlers"
      url: "https://developers.openai.com/api/docs/bots"
      fuerza: A
      tipo_evidencia: requisito_oficial
      nota: "Si se bloquea OAI-SearchBot el sitio no aparece en respuestas de ChatGPT search."
    - titulo: "Anthropic, Does Anthropic crawl data from the web"
      url: "https://support.claude.com/en/articles/8896518"
      fuerza: A
      tipo_evidencia: requisito_oficial
    - titulo: "Perplexity, Crawlers"
      url: "https://docs.perplexity.ai/guides/bots"
      fuerza: A
      tipo_evidencia: requisito_oficial
    - titulo: "Meta, Web crawlers"
      url: "https://developers.facebook.com/docs/sharing/webmasters/web-crawlers"
      fuerza: A
      tipo_evidencia: requisito_oficial
    - titulo: "Apple, About Applebot"
      url: "https://support.apple.com/en-us/119829"
      fuerza: A
      tipo_evidencia: requisito_oficial
  verificado_el: "2026-09-10"
  colector: bots.acceso_busqueda
  impacto_esperado: alto
  esfuerzo: bajo
  dependencia: desarrollo
  recomendacion: "Permite explícitamente los bots de búsqueda de IA en robots.txt y verifica que el CDN o WAF no los bloquee."

- id: T-04
  categoria: tecnico
  ambito: sitio
  tipos_pagina: [todas]
  enunciado: "Bloquear bots de entrenamiento (GPTBot, ClaudeBot, Google-Extended, Applebot-Extended, Meta-ExternalAgent, Amazonbot, CCBot) es una decisión de política; los proveedores declaran que no afecta la aparición en búsqueda."
  titulo_hallazgo: "Política de bots de entrenamiento sin definir"
  fuerza: A
  tipo_evidencia: requisito_oficial
  fuentes:
    - titulo: "OpenAI, Overview of OpenAI crawlers"
      url: "https://developers.openai.com/api/docs/bots"
      fuerza: A
      tipo_evidencia: requisito_oficial
    - titulo: "Google Search Central, Google common crawlers (Google-Extended)"
      url: "https://developers.google.com/search/docs/crawling-indexing/google-common-crawlers"
      fuerza: A
      tipo_evidencia: requisito_oficial
      nota: "Google-Extended no afecta la inclusión en Search ni es señal de ranking."
    - titulo: "Apple, About Applebot (Applebot-Extended)"
      url: "https://support.apple.com/en-us/119829"
      fuerza: A
      tipo_evidencia: requisito_oficial
  verificado_el: "2026-09-10"
  colector: bots.politica_entrenamiento
  impacto_esperado: bajo
  esfuerzo: bajo
  dependencia: "legal o dirección"
  horizonte: "30d"
  recomendacion: "Decide y documenta si se permite el uso del contenido para entrenamiento; el skill nunca lo reporta como pérdida de visibilidad."

- id: T-05
  categoria: tecnico
  ambito: sitio
  tipos_pagina: [todas]
  enunciado: "Los fetchers disparados por usuarios (ChatGPT-User, Perplexity-User, Meta-ExternalFetcher) pueden ignorar robots.txt; solo se bloquean vía WAF o CDN y hacerlo reduce la visibilidad en respuestas en tiempo real."
  titulo_hallazgo: "Fetchers por usuario bloqueados"
  fuerza: A
  tipo_evidencia: requisito_oficial
  fuentes:
    - titulo: "OpenAI, Overview of OpenAI crawlers"
      url: "https://developers.openai.com/api/docs/bots"
      fuerza: A
      tipo_evidencia: requisito_oficial
      nota: "ChatGPT-User: robots.txt rules may not apply."
    - titulo: "Perplexity, Crawlers"
      url: "https://docs.perplexity.ai/guides/bots"
      fuerza: A
      tipo_evidencia: requisito_oficial
      nota: "Perplexity-User generally ignores robots.txt rules."
    - titulo: "Anthropic, Does Anthropic crawl data from the web"
      url: "https://support.claude.com/en/articles/8896518"
      fuerza: A
      tipo_evidencia: requisito_oficial
      nota: "Claude-User sí respeta robots.txt; bloquearlo reduce visibilidad en búsqueda dirigida por el usuario."
  verificado_el: "2026-09-10"
  colector: bots.acceso_usuario
  impacto_esperado: medio
  esfuerzo: bajo
  dependencia: desarrollo
  recomendacion: "No bloquees los fetchers por usuario en robots.txt ni en el WAF si se busca aparecer en respuestas en tiempo real."

- id: T-06
  categoria: tecnico
  ambito: metodo
  tipos_pagina: [todas]
  enunciado: "El colector evalúa robots.txt eligiendo el grupo de user-agent más específico, la regla de ruta más larga y, en empate, Allow."
  fuerza: A
  tipo_evidencia: requisito_oficial
  fuentes:
    - titulo: "RFC 9309, sección 2.2"
      url: "https://www.rfc-editor.org/rfc/rfc9309.html"
      fuerza: A
      tipo_evidencia: requisito_oficial
    - titulo: "Google Search Central, How Google interprets the robots.txt specification"
      url: "https://developers.google.com/search/docs/crawling-indexing/robots/robots_txt"
      fuerza: A
      tipo_evidencia: requisito_oficial
  verificado_el: "2026-09-10"
  colector: null
  puntua: false
  impacto_esperado: bajo
  esfuerzo: bajo
  dependencia: propio
  recomendacion: "Regla de método; no genera hallazgos."

- id: T-07
  categoria: tecnico
  ambito: pagina
  tipos_pagina: [todas]
  enunciado: "Para AI Overviews y AI Mode la página debe estar indexada y ser elegible para snippet: sin noindex ni nosnippet, sin max-snippet restrictivo y sin data-nosnippet sobre el contenido principal."
  titulo_hallazgo: "Directivas que excluyen la página de AI Overviews y AI Mode"
  fuerza: A
  tipo_evidencia: requisito_oficial
  fuentes:
    - titulo: "Google Search Central, AI features and your website"
      url: "https://developers.google.com/search/docs/appearance/ai-features"
      fuerza: A
      tipo_evidencia: requisito_oficial
      nota: "Sin requisitos técnicos adicionales; controles: nosnippet, data-nosnippet, max-snippet, noindex."
    - titulo: "Google Search Central, Robots meta tag specifications"
      url: "https://developers.google.com/search/docs/crawling-indexing/robots-meta-tag"
      fuerza: A
      tipo_evidencia: requisito_oficial
      nota: "nosnippet y max-snippet limitan el uso como insumo de AI Overviews y AI Mode."
    - titulo: "Google Search Central, AI optimization guide"
      url: "https://developers.google.com/search/docs/fundamentals/ai-optimization-guide"
      fuerza: A
      tipo_evidencia: requisito_oficial
  verificado_el: "2026-09-10"
  colector: tecnico.directivas_snippet
  impacto_esperado: alto
  esfuerzo: bajo
  dependencia: desarrollo
  recomendacion: "Retira noindex y nosnippet de las páginas que deban aparecer; usa max-snippet:-1 o sin límite; aplica data-nosnippet solo a fragmentos que no deban citarse."

- id: T-08
  categoria: tecnico
  ambito: sitio
  tipos_pagina: [todas]
  enunciado: "Google-Extended no controla AI Overviews ni AI Mode y no afecta la inclusión ni el ranking en Google Search; bloquearlo no debe reportarse como pérdida de visibilidad."
  titulo_hallazgo: "Google-Extended bloqueado (solo entrenamiento y grounding en Gemini y Vertex AI)"
  fuerza: A
  tipo_evidencia: requisito_oficial
  fuentes:
    - titulo: "Google Search Central, Google common crawlers"
      url: "https://developers.google.com/search/docs/crawling-indexing/google-common-crawlers"
      fuerza: A
      tipo_evidencia: requisito_oficial
      nota: "Google-Extended does not impact a site's inclusion in Google Search nor is it used as a ranking signal."
  verificado_el: "2026-09-10"
  colector: bots.google_extended
  impacto_esperado: bajo
  esfuerzo: bajo
  dependencia: "legal o dirección"
  recomendacion: "Trátalo como decisión de política sobre entrenamiento y grounding en Gemini; no como problema de visibilidad en Google Search."

- id: T-09
  categoria: tecnico
  ambito: pagina
  tipos_pagina: [todas]
  enunciado: "El contenido principal está presente en el HTML inicial sin depender de JavaScript; Google renderiza con Chromium, pero no todos los bots ejecutan JavaScript."
  titulo_hallazgo: "Contenido principal dependiente de JavaScript"
  fuerza: A
  tipo_evidencia: requisito_oficial
  fuentes:
    - titulo: "Google Search Central, Understand JavaScript SEO basics"
      url: "https://developers.google.com/search/docs/crawling-indexing/javascript/javascript-seo-basics"
      fuerza: A
      tipo_evidencia: requisito_oficial
      nota: "Server-side or pre-rendering is still a great idea... not all bots can run JavaScript. Para bots de OpenAI, Anthropic o Perplexity no hay documentación sobre ejecución de JavaScript (fuerza C)."
  verificado_el: "2026-09-10"
  colector: tecnico.dependencia_js
  impacto_esperado: alto
  esfuerzo: alto
  dependencia: desarrollo
  recomendacion: "Sirve el contenido principal en el HTML inicial mediante SSR o prerender; verifica con render sin JavaScript."

- id: T-10
  categoria: tecnico
  ambito: pagina
  tipos_pagina: [todas]
  enunciado: "La página declara un canonical absoluto, autorreferente y coincidente con la URL final."
  titulo_hallazgo: "Canonical ausente, relativo o distinto de la URL final"
  fuerza: A
  tipo_evidencia: requisito_oficial
  fuentes:
    - titulo: "Google Search Central, How to specify a canonical with rel=canonical and other methods"
      url: "https://developers.google.com/search/docs/crawling-indexing/consolidate-duplicate-urls"
      fuerza: A
      tipo_evidencia: requisito_oficial
      nota: "rel=canonical es señal fuerte; usar rutas absolutas; canonical autorreferente recomendado."
  verificado_el: "2026-09-10"
  colector: tecnico.canonical
  impacto_esperado: medio
  esfuerzo: bajo
  dependencia: desarrollo
  recomendacion: "Declara un canonical absoluto que apunte a la propia URL final o a la versión que debe consolidar."

- id: T-11
  categoria: tecnico
  ambito: sitio
  tipos_pagina: [todas]
  enunciado: "Existe un sitemap XML declarado en robots.txt o en /sitemap.xml, con lastmod que refleja la última actualización significativa y sin superar 50.000 URLs o 50 MB."
  titulo_hallazgo: "Sitemap ausente o sin lastmod fiable"
  fuerza: A
  tipo_evidencia: requisito_oficial
  fuentes:
    - titulo: "Google Search Central, Build and submit a sitemap"
      url: "https://developers.google.com/search/docs/crawling-indexing/sitemaps/build-sitemap"
      fuerza: A
      tipo_evidencia: requisito_oficial
      nota: "lastmod debe reflejar la última actualización significativa; Google ignora priority y changefreq."
  verificado_el: "2026-09-10"
  colector: tecnico.sitemap
  impacto_esperado: medio
  esfuerzo: bajo
  dependencia: desarrollo
  recomendacion: "Publica un sitemap XML, decláralo en robots.txt y mantén lastmod exacto."

- id: T-12
  categoria: tecnico
  ambito: pagina
  tipos_pagina: [todas]
  enunciado: "Cuando hay versiones por idioma o región, cada página declara hreflang bidireccional con x-default."
  titulo_hallazgo: "hreflang incompleto o sin retorno"
  fuerza: A
  tipo_evidencia: requisito_oficial
  fuentes:
    - titulo: "Google Search Central, Tell Google about localized versions of your page"
      url: "https://developers.google.com/search/docs/specialty/international/localized-versions"
      fuerza: A
      tipo_evidencia: requisito_oficial
      nota: "If two pages don't both point to each other, the tags will be ignored."
  verificado_el: "2026-09-10"
  colector: tecnico.hreflang
  impacto_esperado: medio
  esfuerzo: medio
  dependencia: desarrollo
  recomendacion: "Añade hreflang para cada variante, incluida la propia página y x-default, y verifica los enlaces de retorno."

- id: T-13
  categoria: tecnico
  ambito: pagina
  tipos_pagina: [todas]
  enunciado: "La página no lleva meta bingbot nocache ni noarchive si se busca aparecer en Copilot y en las respuestas de IA de Bing."
  titulo_hallazgo: "Meta bingbot nocache o noarchive limita Copilot"
  fuerza: A
  tipo_evidencia: requisito_oficial
  fuentes:
    - titulo: "Bing Webmaster Blog, Announcing new options for webmasters to control their content in Bing Chat"
      url: "https://blogs.bing.com/webmaster/september-2023/Announcing-new-options-for-webmasters-to-control-their-content-in-Bing-Chat"
      fuerza: A
      tipo_evidencia: requisito_oficial
      nota: "nocache limita a URL, título y snippet; noarchive excluye de las respuestas y del entrenamiento."
  verificado_el: "2026-09-10"
  colector: tecnico.meta_bingbot
  impacto_esperado: medio
  esfuerzo: bajo
  dependencia: desarrollo
  recomendacion: "Retira nocache o noarchive de la meta bingbot en las páginas que deban citarse en Copilot."

- id: T-14
  categoria: tecnico
  ambito: pagina
  tipos_pagina: [todas]
  enunciado: "La página tiene una meta description única y descriptiva; Google puede usarla como snippet."
  titulo_hallazgo: "Meta description ausente, vacía o duplicada"
  fuerza: A
  tipo_evidencia: requisito_oficial
  fuentes:
    - titulo: "Google Search Central, Control your snippets in search results"
      url: "https://developers.google.com/search/docs/appearance/snippet"
      fuerza: A
      tipo_evidencia: requisito_oficial
  verificado_el: "2026-09-10"
  colector: tecnico.meta_description
  impacto_esperado: bajo
  esfuerzo: bajo
  dependencia: contenido
  recomendacion: "Redacta una meta description específica de la página, sin listas de palabras clave."

- id: T-15
  categoria: tecnico
  ambito: sitio
  tipos_pagina: [todas]
  enunciado: "El sitio usa IndexNow o sitemaps actualizados para que Bing y Copilot referencien la versión vigente de cada página."
  titulo_hallazgo: "Sin IndexNow ni sitemap reciente para Bing"
  fuerza: A
  tipo_evidencia: requisito_oficial
  fuentes:
    - titulo: "Bing Webmaster Blog, Introducing AI Performance in Bing Webmaster Tools"
      url: "https://blogs.bing.com/webmaster/February-2026/Introducing-AI-Performance-in-Bing-Webmaster-Tools-Public-Preview"
      fuerza: A
      tipo_evidencia: requisito_oficial
    - titulo: "IndexNow"
      url: "https://www.indexnow.org/"
      fuerza: A
      tipo_evidencia: requisito_oficial
  verificado_el: "2026-09-10"
  colector: tecnico.indexnow
  impacto_esperado: bajo
  esfuerzo: bajo
  dependencia: desarrollo
  recomendacion: "Publica una llave IndexNow y notifica cambios, o mantén lastmod actualizado en el sitemap."

- id: X-00
  categoria: extractabilidad
  ambito: principio
  tipos_pagina: [todas]
  enunciado: "Ser recuperado pesa más que ajustar el texto: la posición del documento en el contexto del modelo supera a cualquier método de optimización de contenido; primero indexación y ranking clásico."
  fuerza: A
  tipo_evidencia: efecto_experimental
  fuentes:
    - titulo: "Puerto et al., C-SEO Bench: Does Conversational SEO Work? (NeurIPS Datasets and Benchmarks 2025)"
      url: "https://arxiv.org/abs/2506.11097"
      fuerza: A
      tipo_evidencia: efecto_experimental
      nota: "La mayoría de métodos C-SEO son ineficaces o dañinos; ser el primer documento del contexto da ganancias mucho mayores."
  verificado_el: "2026-09-10"
  colector: null
  puntua: false
  impacto_esperado: alto
  esfuerzo: medio
  dependencia: propio
  recomendacion: "Prioriza indexación, ranking y cobertura de las consultas antes que reescrituras."

- id: X-01
  categoria: extractabilidad
  ambito: pagina
  tipos_pagina: [articulo, faq, glosario, solucion, comparativa, programa, institucional]
  enunciado: "Las primeras dos o tres oraciones del contenido principal responden directamente a la intención de la página."
  titulo_hallazgo: "El contenido principal no abre con una respuesta directa"
  fuerza: B
  tipo_evidencia: correlacional
  fuentes:
    - titulo: "Zhang, He y Yao, From Citation Selection to Citation Absorption (preprint 2026)"
      url: "https://arxiv.org/abs/2604.25707"
      fuerza: B
      tipo_evidencia: correlacional
      nota: "Las páginas más influyentes son más estructuradas y ricas en definiciones, hechos numéricos, comparaciones y pasos. Correlacional."
    - titulo: "Google Search Central, Control your snippets in search results"
      url: "https://developers.google.com/search/docs/appearance/snippet"
      fuerza: A
      tipo_evidencia: requisito_oficial
      nota: "Los snippets se crean principalmente a partir del contenido de la página."
  verificado_el: "2026-09-10"
  colector: extractabilidad.respuesta_directa
  impacto_esperado: alto
  esfuerzo: bajo
  dependencia: contenido
  recomendacion: "Abre el contenido principal con una respuesta o definición de una a tres oraciones que resuelva la pregunta del título."

- id: X-02
  categoria: extractabilidad
  ambito: pagina
  tipos_pagina: [todas]
  enunciado: "La página tiene un solo H1 y una jerarquía H2/H3 sin saltos, con encabezados que enuncian la pregunta o el subtema."
  titulo_hallazgo: "Jerarquía de encabezados rota o poco descriptiva"
  fuerza: A
  tipo_evidencia: requisito_oficial
  fuentes:
    - titulo: "Bing Webmaster Blog, Introducing AI Performance in Bing Webmaster Tools"
      url: "https://blogs.bing.com/webmaster/February-2026/Introducing-AI-Performance-in-Bing-Webmaster-Tools-Public-Preview"
      fuerza: A
      tipo_evidencia: requisito_oficial
      nota: "Clear headings, tables, and FAQ sections help surface key information."
    - titulo: "Yu et al., Structural Feature Engineering for GEO (preprint 2026)"
      url: "https://arxiv.org/abs/2603.29979"
      fuerza: B
      tipo_evidencia: correlacional
  verificado_el: "2026-09-10"
  colector: extractabilidad.jerarquia
  impacto_esperado: medio
  esfuerzo: bajo
  dependencia: contenido
  recomendacion: "Deja un único H1, encadena H2 y H3 sin saltar niveles y redacta encabezados que enuncien la pregunta o el subtema."

- id: X-03
  categoria: extractabilidad
  ambito: pagina
  tipos_pagina: [comparativa, articulo, solucion, programa, institucional]
  enunciado: "Las comparaciones van en tablas con encabezados y los procesos en listas ordenadas."
  titulo_hallazgo: "Comparaciones o pasos sin tabla ni lista"
  fuerza: A
  tipo_evidencia: requisito_oficial
  fuentes:
    - titulo: "Bing Webmaster Blog, Introducing AI Performance in Bing Webmaster Tools"
      url: "https://blogs.bing.com/webmaster/February-2026/Introducing-AI-Performance-in-Bing-Webmaster-Tools-Public-Preview"
      fuerza: A
      tipo_evidencia: requisito_oficial
    - titulo: "Zhang, He y Yao, From Citation Selection to Citation Absorption (preprint 2026)"
      url: "https://arxiv.org/abs/2604.25707"
      fuerza: B
      tipo_evidencia: correlacional
  verificado_el: "2026-09-10"
  colector: extractabilidad.tablas_listas
  impacto_esperado: medio
  esfuerzo: bajo
  dependencia: contenido
  recomendacion: "Convierte comparaciones en tablas con fila de encabezado y procesos en listas numeradas."

- id: X-04
  categoria: extractabilidad
  ambito: pagina
  tipos_pagina: [articulo, comparativa, solucion, institucional]
  enunciado: "Cada dato numérico del contenido principal lleva su fuente en la misma oración o párrafo."
